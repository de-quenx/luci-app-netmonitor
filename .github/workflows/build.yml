name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  PACKAGE_NAME: luci-app-netmonitor

jobs:
  build:
    name: Build OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '24.10.8'
            branch: openwrt-24.10
            ext: ipk
            arch: x86_64
          - version: '25.12.5'
            branch: openwrt-25.12
            ext: apk
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Feed Directory
        run: |
          mkdir -p feeds/${{ env.PACKAGE_NAME }} artifacts
          rsync -av \
            --exclude='.git/' \
            --exclude='feeds/' \
            --exclude='artifacts/' \
            ./ feeds/${{ env.PACKAGE_NAME }}/

      - name: Build Package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          FEED_DIR: ${{ github.workspace }}/feeds
          PACKAGES: ${{ env.PACKAGE_NAME }} vnstat2 vnstati2
          NO_REFRESH_CHECK: true

      - name: Collect Artifacts
        run: |
          mkdir -p release-artifacts
          
          find ${{ github.workspace }}/artifacts -type f \( -name "${{ env.PACKAGE_NAME }}*.ipk" -o -name "${{ env.PACKAGE_NAME }}*.apk" \) -exec cp {} release-artifacts/ \;

          if [ -z "$(ls -A release-artifacts/)" ]; then
            echo "Build gagal: Tidak ada file paket ditemukan."
            exit 1
          fi

          ls -la release-artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-openwrt-${{ matrix.version }}
          path: release-artifacts/*
          retention-days: 1

      - name: Clean Cache
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            if (caches.data.total_count === 0) return;

            for (const cache of caches.data.actions_caches) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
              } catch (error) {
                console.log('Failed to delete ' + cache.key + ': ' + error.message);
              }
            }

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Package Info
        id: pkg_info
        run: |
          VERSION=$(grep -m 1 'PKG_VERSION:=' ./Makefile | awk -F '=' '{print $2}' | tr -d ' \r')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "v${{ steps.pkg_info.outputs.version }}"
          name: "v${{ steps.pkg_info.outputs.version }}"
          generate_release_notes: false
          draft: false
          body: ""
          files: release-artifacts/*
